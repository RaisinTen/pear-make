name: Build and Package

on:
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build and Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Setup repo
        uses: holepunchto/actions/.github/steps/setup-repo@v1

      - name: Install w/ dev deps
        run: npm ci

      - name: Build by-arch
        run: |
          npm run make:win32-arm64
          npm run make:win32-x64
          npm run make:darwin-arm64
          npm run make:darwin-x64
          npm run make:linux-arm64
          npm run make:linux-x64

      - name: Package
        run: |
          npx --yes pear-build@1.1.1 \
            --darwin-arm64-app out/darwin-arm64/* \
            --darwin-x64-app out/darwin-x64/* \
            --linux-arm64-app out/linux-arm64/* \
            --linux-x64-app out/linux-x64/* \
            --win32-x64-app out/win32-x64/* \
            --win32-arm64-app out/win32-arm64/* \
            --target deployment \
            --package package.json
          tar -C deployment -czf by-arch.tar.gz .

      - name: Upload by-arch
        uses: actions/upload-artifact@v4
        with:
          name: by-arch
          path: by-arch.tar.gz
          if-no-files-found: error
